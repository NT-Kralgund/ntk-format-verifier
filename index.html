<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NTK Official Format Verification</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;margin:0;color:#1d2733}.wrap{max-width:720px;margin:32px auto;padding:18px}.card{background:#fff;border:1px solid #d8dde3;border-radius:14px;padding:22px;box-shadow:0 2px 10px #0000000d}.ok{border-left:7px solid #1b7f3a}.bad{border-left:7px solid #b3261e}h1{font-size:22px;margin:0 0 8px}h2{font-size:20px;margin-top:0}.label{color:#667085;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-top:14px}.value{font-weight:600;word-break:break-word}.small{font-size:13px;color:#667085;line-height:1.5}.badge{display:inline-block;padding:7px 10px;border-radius:999px;font-weight:700;background:#e7f6ec;color:#146c32}.bad .badge{background:#fde9e7;color:#9c2019}code{word-break:break-all}</style><script src="config.js"></script></head><body><div class="wrap"><div id="card" class="card"><h1>NTK Official Format Verification</h1><div class="small" id="office"></div><p class="small">Reading signed security token…</p></div></div><script>
const $=id=>document.getElementById(id); $('office').textContent=window.NTK_OFFICE||'';
function b64uToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0));}
function bytesToHex(b){return [...b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();}
async function main(){const token=new URLSearchParams(location.search).get('token');const card=$('card');if(!token){card.className='card bad';card.innerHTML='<h1>NTK Official Format Verification</h1><span class="badge">NO TOKEN</span><p class="small">Scan the QR printed on an NTK Official Format.</p>';return;}try{const [p64,s64]=token.split('.');if(!p64||!s64)throw Error('Malformed token');const raw=b64uToBytes(p64),sig=b64uToBytes(s64);const p=JSON.parse(new TextDecoder().decode(raw));const key=await crypto.subtle.importKey('raw',b64uToBytes(window.NTK_PUBLIC_KEY_B64),{name:'Ed25519'},false,['verify']);const ok=await crypto.subtle.verify({name:'Ed25519'},key,sig,raw);card.className='card '+(ok?'ok':'bad');card.innerHTML='<h1>NTK Official Format Verification</h1><span class="badge">'+(ok?'AUTHENTIC OFFICIAL FORMAT':'SIGNATURE INVALID')+'</span>'+(ok?`<div class="label">Office</div><div class="value">${p.office}</div><div class="label">Format Code</div><div class="value">${p.code}</div><div class="label">Title</div><div class="value">${p.title}</div><div class="label">Revision</div><div class="value">${p.revision}</div><div class="label">Applicability</div><div class="value">${p.applicability}</div><div class="label">Source SHA-256</div><div class="value"><code>${p.source_sha256}</code></div><p class="small">This result authenticates the NTK format token. It does not verify applicant data or other annexures.</p>`:'<p class="small">The signed token could not be authenticated.</p>');}catch(e){card.className='card bad';card.innerHTML='<h1>NTK Official Format Verification</h1><span class="badge">VERIFICATION ERROR</span><p class="small">'+e.message+'</p>';}}
main();</script></body></html>
